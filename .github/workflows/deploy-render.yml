name: Deploy Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'tumainih/-kingdom-mentor'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping (Render autoDeploy from GitHub may still run)."
            exit 0
          fi
          curl -fsS "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
